name: JellyUI
options:
  bundleIdPrefix: app.jellyui
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  JellyUI:
    type: application
    platform: iOS
    sources:
      - JellyUI
    info:
      path: JellyUI/Info.plist
      properties:
        CFBundleDisplayName: Monarth
        CFBundleName: Monarth
        UILaunchScreen:
          UIColorName: ""
        UIBackgroundModes: [audio]
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIUserInterfaceStyle: Dark
        UIAppFonts: [Questrial.ttf, Lato-Black.ttf]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.jellyui.swift
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
